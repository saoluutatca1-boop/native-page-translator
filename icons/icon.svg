<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradient chéo accent của design system (khớp NPT_ICONS.logo) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".55" stop-color="#4f7bf7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Nền squircle bo góc 36px (~28% của 128, khớp rx 9 trên lưới 32) -->
  <rect width="128" height="128" rx="36" fill="url(#bg)"/>
  <!-- Glyph chữ 文 vẽ bằng nét stroke trắng (không phụ thuộc font) -->
  <g fill="none" stroke="#ffffff" stroke-width="9.2" stroke-linecap="round">
    <path d="M58.4 26.4 64 37.6"/>
    <path d="M29.6 48.8h60.8"/>
    <path d="M60 48.8 35.2 100.8"/>
    <path d="M60 48.8 90.4 100"/>
  </g>
  <!-- Tia spark 4 cánh góc trên phải -->
  <path fill="#ffffff" d="M97.6 18.4c2 9.6 5.2 12.8 14.8 14.8-9.6 2-12.8 5.2-14.8 14.8-2-9.6-5.2-12.8-14.8-14.8 9.6-2 12.8-5.2 14.8-14.8Z"/>
</svg>
